<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" fill="none" role="img" aria-labelledby="umbra-title umbra-desc">
  <title id="umbra-title">Six quiet paths into a private journal</title>
  <desc id="umbra-desc">An open, curved paper journal holds abstract ink gestures. Six leaf-shaped bookmarks fan behind its pages, and a small physical clasp sits at the fore-edge. No journal entry, personal information, or therapeutic outcome is depicted.</desc>
