  <title id="noctura-title">Rain, texture, and a quieter wave</title>
  <desc id="noctura-desc">A paper crescent rests above overlapping lavender and ivory wave ribbons. Fine rain strokes and a softly textured paper layer mingle with the waves, which break into faint fragments at either end.</desc>
