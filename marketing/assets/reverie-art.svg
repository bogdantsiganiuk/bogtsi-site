    <path d="m431 181 28 9-8 29-25-12Z" fill="#E2DFEC" stroke="#8D8577" stroke-width="1.9" opacity=".7"/>
    <path d="M452 254c21-15 41-11 47 4" stroke="#7E80A8" stroke-width="3.2" opacity=".8"/>
    <path d="m479 222 18-9 22 20-20 11Z" fill="#F4EEE2" stroke="#7E80A8" stroke-width="2"/>
    <path d="M522 269c-9 11-8 25 1 34" stroke="#7E80A8" stroke-width="3.3"/>
    <path d="m544 247 17 14-9 21-17-13Z" fill="#7E80A8" stroke="#38352F" stroke-width="2"/>
    <!-- The receiving notebook: layered paper, binding holes, a turned corner. -->
    <path d="m419 315 179-18 29 223-179 19c-11 1-19-6-20-17Z" fill="#38352F" opacity=".12"/>
