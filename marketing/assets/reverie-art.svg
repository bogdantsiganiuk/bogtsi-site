<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" fill="none" role="img" aria-labelledby="reverie-title reverie-desc">
  <title id="reverie-title">Gathering what remains at dawn</title>
  <desc id="reverie-desc">A pale dawn crescent releases a few fading ink and paper fragments toward a personal notebook. A loose binding thread connects that notebook with two later volumes, suggesting a self-kept series, not dream interpretation or automated decoding.</desc>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- A cut-paper crescent; its open side belongs to the transparent canvas. -->
    <path d="M292 117c-54 14-89 69-76 123 10 41 42 71 82 77-70 16-134-29-144-91-10-61 36-118 99-119 14 0 27 3 39 10Z" fill="#38352F" opacity=".10"/>
    <path d="M285 106c-54 14-89 69-76 123 10 41 42 71 82 77-70 16-134-29-144-91-10-61 36-118 99-119 14 0 27 3 39 10Z" fill="#F4EEE2" stroke="#38352F" stroke-width="2.7"/>
    <path d="M174 189c-7 44 14 84 47 103" stroke="#7E80A8" stroke-width="3"/>
    <path d="M138 331c62 19 120 12 168-12" stroke="#8D8577" stroke-width="1.8"/>
    <path d="M166 346c26 4 52 3 77-1" stroke="#8D8577" stroke-width="1.5" opacity=".6"/>
    <!-- Incomplete, fading impressions; none is a decipherable symbol. -->
    <path d="M306 159c21-8 39-3 46 12" stroke="#7E80A8" stroke-width="2.5" opacity=".35"/>
    <path d="m336 213 28-12 16 16-28 11Z" fill="#F4EEE2" stroke="#8D8577" stroke-width="1.8" opacity=".45"/>
