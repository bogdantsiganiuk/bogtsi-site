    <path d="m427 336 5 41m5 37 5 41" stroke="#7E80A8" stroke-width="3"/>
    <path d="M484 349c13-8 26-5 30 4m-31 38c14 7 24 3 30-5m16 50c7-11 19-14 28-7" stroke="#7E80A8" stroke-width="2.7"/>
