    <path d="M578 464c35-60 109-61 143-9" stroke="#F4EEE2" stroke-width="6.5"/>
    <path d="M578 464c35-60 109-61 143-9" stroke="#9F2832" stroke-width="2.7"/>
    <path d="m709 451 14 7 2-16" stroke="#F4EEE2" stroke-width="6.5"/>
    <path d="m709 451 14 7 2-16" stroke="#9F2832" stroke-width="2.7"/>
    <path d="M606 546c19 5 41 5 60 0" stroke="#8D8577" stroke-width="1.7"/>
  </g>
